<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/png" href="maison-logo.png">

    <title>Login — Maison</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="login-page">

        <div class="login-card">

            <a href="index.html" class="login-logo">
                <img src="maison-logo.png" alt="Maison logo">
            </a>

            <div class="login-heading">
                <span>WELCOME BACK</span>
                <h1>Sign in to Maison</h1>
                <p>Access your account and manage your reservations.</p>
            </div>

            <form class="login-form">

                <div class="form-group">
                    <label for="email">Email address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        required
                    >
                </div>

                <div class="form-group">
    <label for="password">Password</label>

    <div class="password-wrapper">
        <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            required
        >

       <button type="button" class="password-toggle" data-target="password">
        👁
    </button>
</div>
</div>

<div class="login-options">

                    <label class="remember-me">
                        <input type="checkbox" name="remember">
                        <span>Remember me</span>
                    </label>

                 <a href="forgot-password.html" class="forgot-password">
    Forgot password?
</a>

                </div>

                <button type="submit" class="login-button">
                    Sign In
                </button>

            </form>

            <div class="login-divider">
                <span>or</span>
            </div>

            <p class="create-account">
                Don't have an account?
                <a href="signup.html">Create one</a>
            </p>

            <a href="index.html" class="back-home">
                ← Back to Maison
            </a>

        </div>

    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="scripts.js"></script>

</body>

</html>
