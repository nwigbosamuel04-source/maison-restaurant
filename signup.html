<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/png" href="maison-logo.png">

    <title>Create Account — Maison</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="login-page">

        <div class="login-card">

            <a href="index.html" class="login-logo">
                <img src="maison-logo.png" alt="Maison logo">
            </a>

            <div class="login-heading">
                <span>JOIN MAISON</span>
                <h1>Create your account</h1>
                <p>Save your details and make reservations more easily.</p>
            </div>

            <form class="login-form signup-form">

                <!-- EMAIL -->
                <div class="form-group">
                    <label for="email">Email address</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        required
                    >
                </div>

                <!-- PASSWORD -->
                <div class="form-group">
                    <label for="password">Password</label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Create a password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            data-target="password"
                        >
                            👁
                        </button>

                    </div>
                </div>

                <!-- CONFIRM PASSWORD -->
                <div class="form-group">
                    <label for="confirm-password">Confirm password</label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="confirm-password"
                            name="confirm-password"
                            placeholder="Confirm your password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            data-target="confirm-password"
                        >
                            👁
                        </button>

                    </div>
                </div>

                <!-- SUBMIT -->
                <button type="submit" class="login-button">
                    Create Account
                </button>

            </form>

            <p class="create-account">
                Already have an account?
                <a href="login.html">Sign in</a>
            </p>

            <a href="index.html" class="back-home">
                ← Back to Maison
            </a>

        </div>

    </main>

   <!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- Maison JavaScript -->
<script src="scripts.js"></script>
<script>
</body>

</html>
